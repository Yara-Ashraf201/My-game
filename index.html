<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Jungle Race</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Dragon Jungle Race</h1>
        <p class="subtitle">Press SPACE to jump! Double Jump is enabled.</p>
        
        <div class="stats-bar">
            <div class="stat-box score">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="scoreVal">0</div>
            </div>
            <div class="stat-box high">
                <div class="stat-label">High Score</div>
                <div class="stat-value" id="highScoreVal">0</div>
            </div>
            <div class="stat-box mult">
                <div class="stat-label">Multiplier</div>
                <div class="stat-value" id="multVal">x1</div>
            </div>
            <div class="stat-box obs">
                <div class="stat-label">Obstacles</div>
                <div class="stat-value" id="obsVal">0</div>
            </div>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="760" height="380"></canvas>
            <div class="overlay" id="overlay">
                <h2>Game Over!</h2>
                <p>Final Score:</p>
                <p class="big-score" id="finalScore">0</p>
                <p style="color:#90ee90;">Passed Obstacles: <span id="finalObs">0</span></p>
                <button onclick="startGame()">Play Again</button>
            </div>
        </div>
        
        <div class="controls">
            <button id="startBtn" onclick="startGame()">Start Race</button>
            <button id="jumpBtn" onclick="jump()">Jump (Double Jump)</button>
        </div>
        
        <p class="hint">Use SPACE key or tap screen to jump | Avoid rocks and birds to survive!</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = false;
        let gameOver = false;
        let score = 0;
        let highScore = localStorage.getItem('dragon_high_score') || 0;
        let multiplier = 1;
        let obstaclesPassed = 0;
        let frameCount = 0;
        let speed = 5;
        let groundOffset = 0;

        document.getElementById('highScoreVal').textContent = parseInt(highScore).toLocaleString();

        const dragon = {
            x: 80,
            y: 270,
            w: 50,
            h: 40,
            vy: 0,
            grounded: true,
            jumpsLeft: 2
        };
        
        let obstacles = [];
        let particles = [];
        let clouds = [];
        let trees = [];

        for (let i = 0; i < 6; i++) {
            clouds.push({
                x: Math.random() * 760,
                y: 15 + Math.random() * 80,
                w: 50 + Math.random() * 50,
                h: 25 + Math.random() * 20,
                speed: 0.2 + Math.random() * 0.3
            });
        }
        
        for (let i = 0; i < 10; i++) {
            trees.push({
                x: i * 90 + Math.random() * 40,
                h: 50 + Math.random() * 50,
                type: Math.floor(Math.random() * 3)
            });
        }

        function drawCloud(c) {
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.h, 0, Math.PI * 2);
            ctx.arc(c.x + c.w * 0.35, c.y - c.h * 0.3, c.h * 0.75, 0, Math.PI * 2);
            ctx.arc(c.x + c.w * 0.65, c.y, c.h * 0.65, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawTree(t) {
            const y = 310;
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(t.x + 10, y - t.h + 25, 14, t.h - 25);
            ctx.fillStyle = ['#1b5e20', '#2e7d32', '#388e3c'][t.type];
            ctx.beginPath();
            ctx.arc(t.x + 17, y - t.h + 25, 28, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawDragon() {
            const x = dragon.x, y = dragon.y;
            ctx.save();
            
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x + 25, 310, 25, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ff4500';
            ctx.beginPath();
            ctx.ellipse(x + 25, y + 22, 26, 19, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff6347';
            ctx.beginPath();
            ctx.ellipse(x + 48, y + 8, 16, 14, -0.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x + 53, y + 4, 5.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + 55, y + 4, 2.8, 0, Math.PI * 2);
            ctx.fill();

            const wingY = y - 12 + Math.sin(frameCount * 0.25) * 12;
            ctx.fillStyle = '#ff7f50';
            ctx.beginPath();
            ctx.moveTo(x + 12, y + 8);
            ctx.lineTo(x - 8, wingY);
            ctx.lineTo(x + 8, wingY + 20);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#ff4500';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(x, y + 22);
            ctx.quadraticCurveTo(x - 20, y + 10 + Math.sin(frameCount * 0.15) * 10, x - 32, y + 25);
            ctx.stroke();

            ctx.restore();
        }

        function drawObstacle(obs) {
            ctx.save();
            const x = obs.x, y = obs.y, w = obs.w, h = obs.h;

            if (obs.type === 'bird') {
                ctx.fillStyle = '#8b0000';
                ctx.beginPath();
                const wingY = Math.sin(frameCount * 0.3) * 10;
                ctx.arc(x + w/2, y + h/2, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + w/2, y + h/2);
                ctx.lineTo(x - 10, y + wingY);
                ctx.lineTo(x + w/2 + 5, y + h/2);
                ctx.lineTo(x + w + 10, y + wingY);
                ctx.fill();
            } else if (obs.type === 'rock') {
                ctx.fillStyle = '#6d4c41';
                ctx.beginPath();
                ctx.moveTo(x, y + h);
                ctx.lineTo(x + 10, y + 5);
                ctx.lineTo(x + w - 10, y + 5);
                ctx.lineTo(x + w, y + h);
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.fillStyle = '#b71c1c';
                ctx.beginPath();
                ctx.moveTo(x, y + h);
                ctx.lineTo(x + w / 2, y);
                ctx.lineTo(x + w, y + h);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 1) * 6,
                    size: 3 + Math.random() * 4,
                    color: color,
                    life: 25 + Math.random() * 15
                });
            }
        }

        function drawParticles() {
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 40;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });
            ctx.globalAlpha = 1;
        }

        function spawnObstacle() {
            const types = ['rock', 'spike', 'bird'];
            const type = types[Math.floor(Math.random() * types.length)];
            let y = 270, h = 40, w = 40;
            
            if (type === 'bird') {
                y = 190 - Math.random() * 40;
                h = 30;
                w = 30;
            }
            
            obstacles.push({ x: 800, y: y, w: w, h: h, type: type, passed: false });
        }

        function update() {
            if (!gameRunning || gameOver) return;
            
            frameCount++;
            score += Math.floor(speed * multiplier * 0.1);
            groundOffset = (groundOffset - speed) % 40;
            
            if (frameCount % 3 === 0) {
                spawnParticles(dragon.x - 5, dragon.y + 25, '#ff8c00', 1);
            }

            dragon.vy += 0.7;
            dragon.y += dragon.vy;
            
            if (dragon.y >= 270) {
                dragon.y = 270;
                dragon.vy = 0;
                dragon.grounded = true;
                dragon.jumpsLeft = 2;
            }
            
            if (frameCount % Math.max(60, 100 - Math.floor(speed * 3)) === 0) {
                spawnObstacle();
                if (speed < 12) speed += 0.15;
            }
            
            obstacles = obstacles.filter(obs => obs.x > -60);
            
            obstacles.forEach(obs => {
                obs.x -= speed;
                
                if (!obs.passed &&
                    dragon.x < obs.x + obs.w - 5 &&
                    dragon.x + dragon.w > obs.x + 5 &&
                    dragon.y < obs.y + obs.h - 5 &&
                    dragon.y + dragon.h > obs.y + 5) {
                    
                    obs.passed = true;
                    spawnParticles(dragon.x + 25, dragon.y + 20, '#ff4500', 30);
                    
                    canvas.classList.add('flash-red');
                    setTimeout(() => canvas.classList.remove('flash-red'), 300);
                    
                    endGame();
                    return;
                }
                
                if (!obs.passed && obs.x + obs.w < dragon.x) {
                    obs.passed = true;
                    obstaclesPassed++;
                    multiplier = Math.min(multiplier + 0.2, 5);
                    spawnParticles(obs.x + obs.w / 2, obs.y, '#32cd32', 8);
                }
            });

            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x + c.w < -50) c.x = 800;
            });
            
            trees.forEach(t => {
                t.x -= speed * 0.3;
                if (t.x < -60) t.x = 800;
            });
            
            document.getElementById('scoreVal').textContent = score.toLocaleString();
            document.getElementById('multVal').textContent = 'x' + multiplier.toFixed(1);
            document.getElementById('obsVal').textContent = obstaclesPassed;
        }

        function draw() {
            ctx.clearRect(0, 0, 760, 380);
            
            const skyGrad = ctx.createLinearGradient(0, 0, 0, 380);
            skyGrad.addColorStop(0, '#87CEEB');
            skyGrad.addColorStop(0.5, '#B0E0E6');
            skyGrad.addColorStop(0.5, '#4caf50');
            skyGrad.addColorStop(1, '#1b5e20');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, 760, 380);

            clouds.forEach(drawCloud);
            trees.forEach(drawTree);
            
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(0, 310, 760, 70);
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let i = groundOffset; i < 760; i += 40) {
                ctx.fillRect(i, 310, 20, 70);
            }

            obstacles.forEach(drawObstacle);
            drawDragon();
            drawParticles();

            if (!gameRunning && !gameOver && frameCount === 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, 760, 380);
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('DRAGON JUNGLE RACE', 380, 170);
                ctx.fillStyle = '#fff';
                ctx.font = '18px Arial';
                ctx.fillText('Press SPACE to Start & Jump', 380, 220);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function jump() {
            if (gameRunning && !gameOver && dragon.jumpsLeft > 0) {
                dragon.vy = -12;
                dragon.grounded = false;
                dragon.jumpsLeft--;
                spawnParticles(dragon.x + 20, dragon.y + 35, '#ffd700', 10);
            }
        }

        function startGame() {
            gameRunning = true;
            gameOver = false;
            score = 0;
            multiplier = 1;
            obstaclesPassed = 0;
            frameCount = 0;
            speed = 5;
            dragon.y = 270;
            dragon.vy = 0;
            dragon.jumpsLeft = 2;
            obstacles = [];
            particles = [];
            document.getElementById('overlay').style.display = 'none';
        }

        function endGame() {
            gameOver = true;
            gameRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('dragon_high_score', highScore);
                document.getElementById('highScoreVal').textContent = highScore.toLocaleString();
            }
            document.getElementById('finalScore').textContent = score.toLocaleString();
            document.getElementById('finalObs').textContent = obstaclesPassed;
            document.getElementById('overlay').style.display = 'block';
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameRunning && !gameOver) startGame();
                else if (gameRunning) jump();
                else if (gameOver) startGame();
            }
        });

        canvas.addEventListener('click', () => {
            if (gameRunning) jump();
        });

        gameLoop();
    </script>
</body>
</html>
